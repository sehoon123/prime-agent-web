name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip httpx beautifulsoup4 "tomli; python_version < '3.11'"
      - name: Run offline tests
        env:
          PYTHONPATH: skills/websearch/src
        run: python -m unittest discover -s tests -t . -v
      - name: Verify the skill package builds
        run: |
          python -m pip install hatchling build
          python -m build --wheel skills/websearch
