[project]
# Distribution name mirrors the bundled-skill convention used by Prime Agent, so
# the `webfetch` import can only ever come from one installed package.
name = "prime-agent-skill-webfetch"
version = "0.4.0"
description = "Fetch URLs as readable markdown for Prime Agent: structure-preserving HTML extraction, PDF text, SSRF-guarded requests"
readme = "SKILL.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=4.0",
]

[project.scripts]
# The script name must match the Python import name exactly.
webfetch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webfetch"]
